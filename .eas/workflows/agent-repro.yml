# Tag an issue, get a repro.
#
# Dispatched by .github/workflows/agent-repro-dispatch.yml when someone adds
# the `repro` label to a GitHub issue. A headless Claude Code agent, driving
# Argent on a macOS worker, reproduces the reported bug on an iOS simulator
# and posts the evidence back to the issue: numbered steps, screenshots,
# crash log, and a suspected code path. If the bug reproduces, it dispatches
# agent-triage.yml to write the fix.
#
# Needs one simulator build to exist first (seed it once):
#   eas build --platform ios --profile simulator
#
# Required EAS environment variables (production environment):
#   CLAUDE_CODE_OAUTH_TOKEN - headless Claude Code auth (`claude setup-token`).
#                             Do NOT also set ANTHROPIC_API_KEY; it takes
#                             precedence and bills the API instead.
#   GITHUB_TOKEN            - repo-scoped token: read issues, comment, push
#                             the evidence branch
#   EXPO_TOKEN              - dispatches agent-triage.yml on a confirmed repro
name: Agent repro (issue → on-device evidence)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to reproduce'
        required: true

jobs:
  get_sim_build:
    name: Find simulator build
    type: get-build
    params:
      platform: ios
      profile: simulator

  repro:
    name: Reproduce on simulator (Claude + Argent)
    runs_on: macos-medium
    needs: [get_sim_build]
    environment: production
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: eas/checkout
      - id: download
        uses: eas/download_build
        with:
          build_id: ${{ needs.get_sim_build.outputs.build_id }}
      - name: Install Claude Code + Argent
        run: npm install -g @anthropic-ai/claude-code@latest @swmansion/argent@latest
      - name: Run repro agent
        run: |
          case "$ISSUE_NUMBER" in *'${{'*|'') echo "issue_number input missing" >&2; exit 1;; esac
          # Locate the .app extracted by eas/download_build (step outputs are
          # not interpolatable into step env on EAS workers).
          APP_PATH=$(find "${TMPDIR:-/tmp}" -maxdepth 5 -type d -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not locate the downloaded simulator .app under ${TMPDIR:-/tmp}" >&2
            exit 1
          fi
          echo "Using APP_PATH=$APP_PATH"
          export APP_PATH
          mkdir -p repro-artifacts
          # --dangerously-skip-permissions: allowlist patterns reject commands
          # that expand env vars (GITHUB_TOKEN), which blocks every gh/git call
          # in headless mode. Safe here: ephemeral single-purpose VM with
          # repo-scoped secrets.
          claude -p "$(cat .agents/repro-prompt.md)" \
            --mcp-config '{"mcpServers":{"argent":{"command":"argent","args":["mcp"]}}}' \
            --dangerously-skip-permissions \
            --max-turns 60 \
            --output-format json || echo "Repro agent exited non-zero; verdict file decides"
      - name: Upload repro artifacts
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: repro-artifacts
          path: repro-artifacts
          ignore_error: true
      - name: Dispatch triage on a confirmed repro
        run: |
          VERDICT=$(cat repro-artifacts/reproduced 2>/dev/null || echo "no")
          echo "Repro verdict: $VERDICT"
          if [ "$VERDICT" = "yes" ]; then
            npx eas-cli@latest workflow:run .eas/workflows/agent-triage.yml \
              -F issue_number="$ISSUE_NUMBER" \
              --non-interactive
          else
            echo "Not confirmed; triage not dispatched."
          fi
