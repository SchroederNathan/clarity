# Headless Claude Code triages a GitHub issue (usually one with fresh
# on-device evidence from agent-repro.yml), finds the root cause, writes the
# minimal fix, and opens a PR labeled `agent-fix`. A human reviews and
# merges; the agent never merges.
#
# Required EAS environment variables (production environment):
#   CLAUDE_CODE_OAUTH_TOKEN - headless Claude Code auth (`claude setup-token`).
#                             Do NOT also set ANTHROPIC_API_KEY; it takes
#                             precedence and bills the API instead.
#   GITHUB_TOKEN            - repo-scoped token; reads the issue, pushes the
#                             branch, opens the PR
name: Agent triage (issue → fix PR)

# Dispatch-only. Invoked by:
#   - agent-repro.yml when the repro agent confirms the bug on-device
#   - manually: eas workflow:run .eas/workflows/agent-triage.yml -F issue_number=12
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to fix'
        required: true

jobs:
  triage:
    name: Root cause, fix, open PR
    environment: production
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run triage agent
        run: |
          case "$ISSUE_NUMBER" in *'${{'*|'') echo "issue_number input missing" >&2; exit 1;; esac
          npm install -g @anthropic-ai/claude-code@latest
          # --dangerously-skip-permissions: allowlist patterns reject commands
          # that expand env vars (GITHUB_TOKEN), which blocks every gh/git call
          # in headless mode. Safe here: ephemeral single-purpose VM with
          # repo-scoped secrets.
          claude -p "$(cat .agents/triage-prompt.md)" \
            --dangerously-skip-permissions \
            --max-turns 80 \
            --output-format json
