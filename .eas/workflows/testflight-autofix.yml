# TestFlight feedback in, verified fix PR out — queued, serialized, chained.
#
# Modeled on brentvatne/euxy (crash-triage.yml / feedback-triage.yml):
# the App Store Connect beta_feedback event triggers the run directly and
# the same run carries the work to a PR. No GitHub label bridge in this
# path; labeling an issue `repro` by hand still works and dispatches
# agent-fix.yml as before.
#
# Three jobs, so the pipeline reads as three nodes in the workflow graph:
#   triage — agent (.agents/triage-prompt.md): fetch feedback via
#            `eas testflight:feedback` (ASC key comes from the EAS
#            credentials service), dedupe against existing issues, QUEUE
#            each new actionable report as an issue labeled
#            `testflight-queued`. Never blocks, never asks a human.
#   claim  — scripts/testflight-drain.sh claim: EAS has no run queueing,
#            so concurrent event runs race. An atomic git-ref lock
#            (refs/heads/agent-fix-lock, stolen after 3h if stale)
#            serializes them; the winner claims the OLDEST queued issue,
#            relabels it `testflight`, and outputs its number. Fast job:
#            no node_modules, no agent. Losers output nothing; their
#            queued work is drained by the lock holder's chain or the
#            cron sweep.
#   fix    — skipped unless claim output an issue. Runs the fix agent
#            (.agents/fix-prompt.md, unchanged): repro on an EAS
#            Simulator -> minimal fix -> verification build -> second
#            simulator session -> PR with videos. Releases the lock, then
#            dispatches a sweep run if the queue still has work (the
#            chain). On agent failure: labels the issue `needs-human` and
#            still releases + chains.
#
# Trigger: the beta_feedback event only (requires the ASC connection in
# EAS project settings). The trigger context injects the submission
# id/type/url. EAS validates job env against the specific trigger's
# context, so the ${{ app_store_connect.* }} references below make this
# file un-runnable from cron or `eas workflow:run` — the sweep and manual
# runs live in testflight-sweep.yml instead (same jobs, no context).
#
# Idempotent: every filed issue carries a TestFlight-Feedback-IDs footer
# the triage agent dedupes against, so overlapping event + sweep runs file
# nothing twice. Queued issues get `testflight-queued`, never `repro` —
# the `repro` label would fire the GitHub bridge and dispatch a duplicate
# fix run.
#
# Required EAS environment variables (production environment) — all
# already present for agent-fix.yml:
#   CLAUDE_CODE_OAUTH_TOKEN - headless Claude Code auth (`claude setup-token`).
#                             Do NOT also set ANTHROPIC_API_KEY.
#   GITHUB_TOKEN            - fine-grained PAT: Issues, Contents,
#                             Pull requests (read/write)
#   EXPO_TOKEN              - eas-cli auth: testflight:feedback, simulator
#                             sessions, the verification build, and the
#                             chain dispatch
name: TestFlight autofix (feedback -> queue -> fix -> verified PR)

on:
  app_store_connect:
    beta_feedback:
      types:
        - crash
        - screenshot

jobs:
  triage:
    name: Triage feedback into the queue
    environment: production
    env:
      FEEDBACK_ID: ${{ app_store_connect.beta_feedback.id }}
      FEEDBACK_TYPE: ${{ app_store_connect.beta_feedback.type }}
      FEEDBACK_URL: ${{ app_store_connect.beta_feedback.url }}
      # .env.local is not on the worker, but be explicit: the submit
      # profile must resolve the production bundle id, not the .dev one.
      APP_VARIANT: production
    steps:
      - uses: eas/checkout
      # eas-cli evaluates app.config.ts, which needs node_modules.
      - uses: eas/install_node_modules
      - name: Queue new reports as issues
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          # --dangerously-skip-permissions: same rationale as agent-fix.yml
          # (allowlist patterns reject commands expanding GITHUB_TOKEN).
          # Safe here: ephemeral single-purpose VM with scoped secrets.
          claude -p "$(cat .agents/triage-prompt.md)" \
            --dangerously-skip-permissions \
            --max-turns 60 \
            --output-format json

  claim:
    name: Claim the oldest queued issue
    needs: [triage]
    environment: production
    env:
      WORKFLOW_URL: ${{ workflow.url }}
    outputs:
      issue_number: ${{ steps.claim.outputs.issue_number }}
    steps:
      - uses: eas/checkout
      - id: claim
        name: Lock the queue and pick
        run: bash scripts/testflight-drain.sh claim

  fix:
    name: Fix the claimed issue, verify, open PR
    needs: [claim]
    if: ${{ needs.claim.outputs.issue_number != '' }}
    environment: production
    env:
      ISSUE_NUMBER: ${{ needs.claim.outputs.issue_number }}
      WORKFLOW_URL: ${{ workflow.url }}
      APP_VARIANT: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run fix agent, release lock, chain
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          bash scripts/testflight-drain.sh fix
